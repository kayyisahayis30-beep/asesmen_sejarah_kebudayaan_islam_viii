<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen Sumatif SKI - Kelas VIII</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }

</head>
<body class="text-slate-800 antialiased h-screen flex flex-col">

    <div id="app" class="flex-grow flex flex-col w-full max-w-5xl mx-auto md:p-4">
        <!-- Dynamic Content Will Be Injected Here -->
    </div>

    <script>
        // Default Data Configuration
        const APP_TITLE = "Asesmen Sumatif Sejarah Kebudayaan Islam";
        const CREATOR = "Amirotul Kayyisah, S.Pd.";
        const KKM = 80;
        const TIME_LIMIT = 90 * 60; // 90 minutes in seconds
        
        let appState = {
            admin: { username: 'admin', password: 'password' },
            settings: {
                logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Logo_Kementerian_Agama_Republik_Indonesia.png/600px-Logo_Kementerian_Agama_Republik_Indonesia.png' // Default logo Kemenag
            },
            students: {}, // Format: "Presensi_Nama": { attempts: 0, scores: [] }
            currentUser: null, // { role: 'admin' | 'student', name, presensi }
            exam: {
                isActive: false,
                timeLeft: TIME_LIMIT,
                answers: {}, // { qId: answer }
                timerInterval: null
            }
        };

        // Bank Soal
        let questionBank = {
            mc: [
                { id: 'm1', text: "Sebuah komunitas masyarakat mengalami pergolakan karena merasa pembagian kekuasaan dan kekayaan negara tidak adil, didominasi oleh satu kelompok elit saja. Situasi ini mirip dengan akhir masa Umayyah. Kelompok mana yang merasa dianaktirikan dan akhirnya menjadi pendukung utama berdirinya Daulah Abbasiyah?", options: ["Kaum Khawarij", "Kaum Mawali", "Kaum Qadariyah", "Kaum Nasrani"], answer: 1 },
                { id: 'm2', text: "Abu al-Abbas as-Saffah memindahkan pusat pemerintahan dari Damaskus untuk menjauhi sisa-sisa pengaruh Umayyah dan mencari basis dukungan yang kuat. Jika Anda seorang pemimpin yang mencari basis yang strategis secara militer dan ekonomi saat itu, wilayah mana yang paling tepat dan menjadi pilihan pertama sebelum ke Baghdad?", options: ["Kufah", "Mekkah", "Kairo", "Kordoba"], answer: 0 },
                { id: 'm3', text: "Saat sebuah negara menetapkan kebijakan inklusif, berbagai suku bangsa dapat menduduki jabatan penting. Hal ini terjadi pada masa Abbasiyah dimana orang-orang Persia mendapat posisi tinggi. Dampak paling signifikan dari kebijakan ini terhadap peradaban Abbasiyah adalah...", options: ["Melemahnya kekuatan militer", "Asimilasi budaya dan pesatnya ilmu pengetahuan", "Pemberontakan dari kaum Arab murni", "Timbulnya sistem monarki absolut"], answer: 1 },
                { id: 'm4', text: "Banyak negara modern mengalokasikan dana besar untuk lembaga riset nasional. Khalifah Al-Ma'mun melakukan hal serupa di masanya dengan mengembangkan institusi secara maksimal. Institusi apakah yang fungsinya setara dengan lembaga riset dan penerjemahan nasional tersebut?", options: ["Nizamiyah", "Baitul Hikmah", "Kuttab", "Madrasah Mustansyiriyah"], answer: 1 },
                { id: 'm5', text: "Seorang dokter di rumah sakit modern sedang memeriksa rekam medis pasien menggunakan prinsip observasi klinis sebelum memberi diagnosis. Tradisi observasi klinis sistematis ini banyak dipelopori oleh ilmuwan Abbasiyah yang menulis buku 'Al-Hawi'. Siapakah tokoh yang dimaksud?", options: ["Ibnu Sina", "Ar-Razi", "Al-Khawarizmi", "Al-Kindi"], answer: 1 },
                { id: 'm6', text: "Dalam merancang sebuah jembatan gantung, insinyur sangat bergantung pada perhitungan sudut, panjang, dan gravitasi. Ilmu pasti semacam ini berkembang pesat di masa Abbasiyah. Siapakah ilmuwan Muslim yang dijuluki bapak Aljabar yang karyanya menjadi dasar algoritma modern?", options: ["Al-Farabi", "Al-Battani", "Al-Khawarizmi", "Jabir bin Hayyan"], answer: 2 },
                { id: 'm7', text: "Ketika sebuah pandemi terjadi, pemerintah segera membangun fasilitas isolasi dan pengobatan gratis. Nilai humanis ini telah diterapkan pada masa Harun ar-Rasyid dengan mendirikan fasilitas kesehatan yang disebut...", options: ["Bimaristan", "Observatorium", "Perpustakaan", "Panti Asuhan"], answer: 0 },
                { id: 'm8', text: "Di era digital, informasi dari berbagai bahasa dapat diterjemahkan dalam hitungan detik. Di masa Abbasiyah, gerakan penerjemahan besar-besaran (dari bahasa Yunani, Persia, India ke bahasa Arab) difasilitasi oleh negara. Tujuan utama gerakan ini secara historis adalah...", options: ["Menghancurkan budaya asli bangsa taklukan", "Menyerap pengetahuan dari peradaban masa lalu untuk dikembangkan", "Menyebarkan ajaran Islam ke Eropa", "Mencari kelemahan taktik perang bangsa Romawi"], answer: 1 },
                { id: 'm9', text: "Seorang apoteker meracik obat kimia berdasarkan takaran yang presisi agar aman bagi manusia. Pengetahuan tentang distilasi, kristalisasi, dan sifat zat kimia pertama kali diletakkan fondasinya oleh ilmuwan Abbasiyah bernama...", options: ["Al-Ghazali", "Ibnu Rusyd", "Jabir bin Hayyan", "Ibnu Khaldun"], answer: 2 },
                { id: 'm10', text: "Sebuah observatorium modern menggunakan teleskop canggih untuk memprediksi gerhana. Di masa Daulah Abbasiyah, ilmu falak (astronomi) sangat penting tidak hanya untuk sains, tetapi juga untuk kepentingan agama, yaitu...", options: ["Menentukan arah kiblat dan waktu salat", "Meramal masa depan khalifah", "Mencari jalur pelayaran baru", "Mendeteksi keberadaan alien"], answer: 0 },
                { id: 'm11', text: "Anda membaca sebuah buku filsafat yang berusaha memadukan pemikiran Aristoteles dengan ajaran Islam. Upaya rasionalisasi ini merupakan ciri khas dinamika ilmu pada masa Abbasiyah yang dipelopori oleh tokoh bergelar 'Guru Kedua' (Al-Mu’allim Ats-Tsani), yaitu...", options: ["Al-Kindi", "Al-Farabi", "Ibnu Tufail", "Ibnu Bajjah"], answer: 1 },
                { id: 'm12', text: "Jika Anda melihat peta tata kota yang berbentuk bundar dengan istana di tengah dan dijaga oleh tembok berlapis, kota ini dirancang untuk keamanan tingkat tinggi dan simbol kebesaran. Kota yang dibangun oleh Khalifah Al-Mansur ini adalah...", options: ["Damaskus", "Samarra", "Baghdad", "Kairo"], answer: 2 },
                { id: 'm13', text: "Banyak mahasiswa kedokteran di Eropa Barat pada abad pertengahan mempelajari buku 'Qanun fi at-Tibb' (The Canon of Medicine) sebagai buku teks wajib. Buku ensiklopedia medis legendaris ini ditulis oleh...", options: ["Ibnu Sina", "Ar-Razi", "Az-Zahrawi", "Ibnu Nafis"], answer: 0 },
                { id: 'm14', text: "Bayangkan sebuah perpustakaan nasional dihancurkan dan koleksi bukunya dibuang ke sungai hingga airnya menghitam karena tinta. Peristiwa tragis ini menandai berakhirnya masa keemasan Abbasiyah di Baghdad akibat serangan dari...", options: ["Pasukan Salib", "Pasukan Mongol (Hulagu Khan)", "Kekaisaran Romawi Timur", "Dinasti Fatimiyah"], answer: 1 },
                { id: 'm15', text: "Kemajuan ekonomi seringkali mendorong kemajuan literasi. Di masa Abbasiyah, industri yang diadopsi dari tawanan perang Cina sangat memicu laju produksi buku dan ilmu pengetahuan. Industri tersebut adalah...", options: ["Industri sutra", "Industri kertas", "Industri mesiu", "Industri keramik"], answer: 1 }
            ],
            complex: [
                { id: 'c1', text: "Dalam mengelola sebuah imperium yang luas, Daulah Abbasiyah menyadari perlunya sistem administrasi yang rapi. Dari pernyataan berikut, manakah yang merupakan langkah strategis yang diambil Abbasiyah untuk memperkuat roda pemerintahan? (Pilih semua yang benar)", options: ["Membentuk posisi Wazir (Perdana Menteri)", "Menghapus sistem pajak bagi non-Muslim", "Mendirikan Diwanul Jund (Departemen Militer)", "Memindahkan ibu kota ke Andalusia", "Mengadopsi sistem tata negara Persia"], answers: [0, 2, 4] },
                { id: 'c2', text: "Sebagai seorang sejarawan yang meneliti faktor penyebab berkembangnya ilmu pengetahuan di masa Abbasiyah, Anda akan menemukan beberapa kondisi pendukung utama. Manakah dari kondisi berikut yang benar? (Pilih semua yang benar)", options: ["Dukungan finansial dari khalifah untuk para peneliti", "Adanya gerakan penaklukan militer ke Eropa Barat", "Stabilitas politik dan pertumbuhan ekonomi kota", "Toleransi terhadap ilmuwan non-Muslim", "Larangan keras terhadap ilmu filsafat Yunani"], answers: [0, 2, 3] },
                { id: 'c3', text: "Perkembangan ilmu agama Islam juga mencapai puncaknya pada masa ini, termasuk ilmu hadis dan fikih. Identifikasi pernyataan yang benar terkait ilmuwan agama pada masa Abbasiyah! (Pilih semua yang benar)", options: ["Imam Bukhari menyusun kitab Shahih Bukhari", "Imam Syafi'i merumuskan ilmu Ushul Fikih", "Jabir bin Hayyan menulis kitab tafsir Al-Qur'an", "Lahirnya empat mazhab fiqih besar (Hanafi, Maliki, Syafi'i, Hanbali)", "Al-Khawarizmi menetapkan hukum faraid (waris) secara eksklusif"], answers: [0, 1, 3] },
                { id: 'c4', text: "Baitul Hikmah bukan sekadar perpustakaan, melainkan pusat peradaban. Kegiatan apa saja yang secara rutin berlangsung di institusi ini pada masa Al-Ma'mun? (Pilih semua yang benar)", options: ["Penerjemahan naskah kuno", "Latihan tempur militer", "Observasi astronomi", "Diskusi dan debat ilmiah", "Pusat perdagangan rempah"], answers: [0, 2, 3] },
                { id: 'c5', text: "Jika Anda mengamati tokoh-tokoh kedokteran Abbasiyah, mereka memiliki kontribusi spesifik yang mengubah dunia medis. Manakah dari pasangan tokoh dan kontribusinya yang benar di bawah ini? (Pilih semua yang benar)", options: ["Ibnu Sina: Menulis Qanun fi at-Tibb", "Ar-Razi: Menemukan perbedaan cacar air dan campak", "Al-Kindi: Ahli bedah pertama", "Hunayn bin Ishaq: Penerjemah karya Galen (Galenus)", "Ibnu Khaldun: Penemu sistem peredaran darah"], answers: [0, 1, 3] },
                { id: 'c6', text: "Kota Baghdad dirancang dengan sangat strategis dan memiliki fasilitas publik yang lengkap. Fasilitas apa saja yang umum ditemukan di pusat-pusat kota pada masa keemasan Abbasiyah? (Pilih semua yang benar)", options: ["Bimaristan (Rumah Sakit)", "Pabrik Kertas", "Bandar Udara", "Kuttab (Sekolah Dasar)", "Perpustakaan Umum"], answers: [0, 1, 3, 4] },
                { id: 'c7', text: "Runtuhnya Daulah Abbasiyah merupakan akumulasi dari berbagai faktor internal dan eksternal. Manakah yang termasuk faktor internal kemunduran tersebut? (Pilih semua yang benar)", options: ["Serangan tentara Mongol", "Perebutan kekuasaan antar keluarga istana", "Gaya hidup mewah para penguasa", "Ekspansi militer Romawi Timur", "Munculnya dinasti-dinasti kecil yang memerdekakan diri"], answers: [1, 2, 4] },
                { id: 'c8', text: "Seni dan arsitektur juga berkembang pesat sebagai wujud keindahan budaya Islam. Ciri khas seni yang berkembang pada masa Abbasiyah antara lain... (Pilih semua yang benar)", options: ["Seni Kaligrafi", "Seni Patung manusia berukuran nyata", "Arsitektur Masjid dengan menara khas (misal: Malwiya di Samarra)", "Seni Arabesque (ornamen geometris/flora)", "Seni lukis wajah khalifah di fasilitas umum"], answers: [0, 2, 3] },
                { id: 'c9', text: "Peran wanita juga terlihat dalam beberapa aspek pada masa Abbasiyah, salah satunya adalah Zubaydah (istri Harun Ar-Rasyid). Apa saja kontribusi penting yang terkait dengan namanya? (Pilih semua yang benar)", options: ["Memimpin pasukan perang melawan Bizantium", "Membangun saluran air bagi jamaah haji (Mata Air Zubaydah)", "Mendanai pembangunan fasilitas umum di rute Mekkah", "Menjadi khalifah wanita pertama", "Mengembangkan kesusastraan istana"], answers: [1, 2, 4] },
                { id: 'c10', text: "Gerakan penerjemahan buku-buku asing memberikan dampak luar biasa. Dari bahasa dan peradaban mana saja buku-buku tersebut umumnya diterjemahkan ke dalam bahasa Arab? (Pilih semua yang benar)", options: ["Yunani", "Sanskerta (India)", "Pahlavi (Persia)", "Suryani (Suriah Kuno)", "Latin Kuno (Amerika Selatan)"], answers: [0, 1, 2, 3] }
            ],
            matching: [
                { id: 'mt1', prompt: "Tokoh yang dikenal sebagai Bapak Aljabar dan menemukan angka nol.", answer: "Al-Khawarizmi" },
                { id: 'mt2', prompt: "Dokter terkemuka penulis ensiklopedia medis 'Al-Hawi' dan peneliti cacar.", answer: "Ar-Razi" },
                { id: 'mt3', prompt: "Bapak Kimia Islam yang menemukan teknik distilasi.", answer: "Jabir bin Hayyan" },
                { id: 'mt4', prompt: "Filsuf muslim yang dijuluki Guru Kedua setelah Aristoteles.", answer: "Al-Farabi" },
                { id: 'mt5', prompt: "Penulis 'Qanun fi at-Tibb', rujukan utama kedokteran Eropa berabad-abad.", answer: "Ibnu Sina" },
                { id: 'mt6', prompt: "Filsuf Arab pertama yang juga ahli dalam matematika dan musik.", answer: "Al-Kindi" },
                { id: 'mt7', prompt: "Astronom muslim penemu kemiringan ekliptika bumi.", answer: "Al-Battani" },
                { id: 'mt8', prompt: "Khalifah yang membangun Baitul Hikmah secara maksimal.", answer: "Al-Ma'mun" },
                { id: 'mt9', prompt: "Pendiri Daulah Abbasiyah yang memindahkan pusat pemerintahan pertama kali.", answer: "As-Saffah" },
                { id: 'mt10', prompt: "Khalifah masa keemasan yang membangun rumah sakit dan dekat dengan rakyat.", answer: "Harun ar-Rasyid" }
            ]
        };

        const matchingOptions = [
            "Al-Khawarizmi", "Ar-Razi", "Jabir bin Hayyan", "Al-Farabi", "Ibnu Sina", 
            "Al-Kindi", "Al-Battani", "Al-Ma'mun", "As-Saffah", "Harun ar-Rasyid"
        ]; // We will shuffle this for the UI

        function saveData() {
            // In a real app this would sync to Cloud. Here it's session-based.
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function shuffleArray(array) {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initApp() {
            renderLogin();
        }

        function showMessage(msg, isError = false) {
            const modal = document.createElement('div');
            modal.className = `fixed top-0 left-0 w-full h-full flex items-center justify-center bg-black bg-opacity-50 z-50`;
            modal.innerHTML = `
                <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 transform transition-all">
                    <h3 class="text-lg font-bold mb-2 ${isError ? 'text-red-600' : 'text-emerald-600'}">${isError ? 'Peringatan' : 'Informasi'}</h3>
                    <p class="text-slate-700 mb-6">${msg}</p>
                    <div class="flex justify-end">
                        <button onclick="this.closest('.fixed').remove()" class="px-4 py-2 bg-slate-800 text-white rounded hover:bg-slate-700">Tutup</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function renderLogin() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden flex flex-col items-center">
                        <div class="w-full bg-emerald-800 p-6 flex flex-col items-center">
                            <img src="${appState.settings.logoUrl}" alt="Logo" class="h-20 mb-3 object-contain rounded-md" onerror="this.src='https://placehold.co/100x100/166534/ffffff?text=LOGO'">
                            <h1 class="text-xl font-bold text-white text-center leading-tight">${APP_TITLE}</h1>
                            <p class="text-emerald-100 text-sm mt-1">Oleh: ${CREATOR}</p>
                        </div>
                        
                        <div class="p-6 w-full">
                            <div class="flex mb-6 border-b">
                                <button id="tab-student" class="flex-1 pb-2 border-b-2 border-emerald-600 text-emerald-800 font-semibold transition">Siswa</button>
                                <button id="tab-admin" class="flex-1 pb-2 border-b-2 border-transparent text-slate-400 font-semibold transition">Admin</button>
                            </div>

                            <!-- Student Form -->
                            <form id="student-login" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap (Username)</label>
                                    <input type="text" id="stud-name" required class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
                                    <select id="stud-class" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                                        <option value="VIII">Kelas VIII (Delapan)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Nomor Presensi (Password)</label>
                                    <input type="number" id="stud-presensi" required min="1" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2 rounded hover:bg-emerald-700 transition">Masuk sebagai Siswa</button>
                            </form>

                            <!-- Admin Form -->
                            <form id="admin-login" class="space-y-4 hidden">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Username Admin</label>
                                    <input type="text" id="admin-username" required class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                    <input type="password" id="admin-pass" required class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                <button type="submit" class="w-full bg-slate-800 text-white font-bold py-2 rounded hover:bg-slate-900 transition">Masuk sebagai Admin</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;

            // Tab logic
            const tabStudent = document.getElementById('tab-student');
            const tabAdmin = document.getElementById('tab-admin');
            const formStudent = document.getElementById('student-login');
            const formAdmin = document.getElementById('admin-login');

            tabStudent.addEventListener('click', () => {
                tabStudent.classList.add('border-emerald-600', 'text-emerald-800');
                tabStudent.classList.remove('border-transparent', 'text-slate-400');
                tabAdmin.classList.remove('border-emerald-600', 'text-emerald-800');
                tabAdmin.classList.add('border-transparent', 'text-slate-400');
                formStudent.classList.remove('hidden');
                formAdmin.classList.add('hidden');
            });

            tabAdmin.addEventListener('click', () => {
                tabAdmin.classList.add('border-emerald-600', 'text-emerald-800');
                tabAdmin.classList.remove('border-transparent', 'text-slate-400');
                tabStudent.classList.remove('border-emerald-600', 'text-emerald-800');
                tabStudent.classList.add('border-transparent', 'text-slate-400');
                formAdmin.classList.remove('hidden');
                formStudent.classList.add('hidden');
            });

            formStudent.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('stud-name').value.trim();
                const presensi = document.getElementById('stud-presensi').value.trim();
                
                const studentKey = `${presensi}_${name}`;
                if (!appState.students[studentKey]) {
                    appState.students[studentKey] = { attempts: 0, scores: [] };
                }

                if (appState.students[studentKey].attempts >= 2) {
                    showMessage("Anda sudah mencapai batas maksimal pengerjaan (2 kali).");
                    return;
                }

                appState.currentUser = { role: 'student', name, presensi, kelas: 'VIII', key: studentKey };
                renderStudentDashboard();
            });

            formAdmin.addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('admin-username').value;
                const p = document.getElementById('admin-pass').value;
                if (u === appState.admin.username && p === appState.admin.password) {
                    appState.currentUser = { role: 'admin', name: 'Administrator' };
                    renderAdminDashboard();
                } else {
                    showMessage("Username atau password admin salah!", true);
                }
            });
        }

        function renderAdminDashboard() {
            if (appState.currentUser.role !== 'admin') return;

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="p-4 flex flex-col h-full">
                    <header class="bg-slate-800 text-white p-4 rounded-lg flex justify-between items-center mb-6 shadow">
                        <div>
                            <h2 class="text-xl font-bold">Panel Admin - ${APP_TITLE}</h2>
                            <p class="text-sm text-slate-300">Mode Guru / Administrator</p>
                        </div>
                        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-medium transition">Keluar</button>
                    </header>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow">
                        <!-- Sidebar -->
                        <div class="space-y-4">
                            <div class="bg-white p-4 rounded-lg shadow border border-slate-100">
                                <h3 class="font-bold text-slate-800 mb-3 border-b pb-2">Aksi Cepat</h3>
                                <button onclick="startTestMode()" class="w-full mb-2 bg-emerald-100 text-emerald-800 hover:bg-emerald-200 py-2 rounded text-sm font-medium transition border border-emerald-300 flex justify-center items-center gap-2">
                                    Uji Coba Aplikasi (Sebagai Siswa)
                                </button>
                                <button onclick="alert('Fitur penyimpanan cloud belum aktif. Hubungi developer untuk integrasi Firebase jika ingin data nilai tersimpan permanen.')" class="w-full bg-blue-50 text-blue-800 hover:bg-blue-100 py-2 rounded text-sm font-medium transition border border-blue-200">
                                    Unduh Rekap Nilai (CSV)
                                </button>

                appState.exam.answers[qId] = [];
            }
            if (isChecked) {
                appState.exam.answers[qId].push(val);
            } else {
                appState.exam.answers[qId] = appState.exam.answers[qId].filter(v => v !== val);
            }
        }

        function confirmFinish() {
            // Count answered
            const totalQuestions = 35;
            let answered = 0;
            
            // Check MC & Matching
            questionBank.mc.forEach(q => { if(appState.exam.answers[q.id] !== undefined) answered++; });
            questionBank.matching.forEach(q => { if(appState.exam.answers[q.id] !== undefined && appState.exam.answers[q.id] !== "") answered++; });
            // Check Complex
            questionBank.complex.forEach(q => { if(appState.exam.answers[q.id] && appState.exam.answers[q.id].length > 0) answered++; });

            let msg = `Anda telah menjawab ${answered} dari ${totalQuestions} soal.\nApakah Anda yakin ingin menyelesaikan ujian?`;
            
            // Custom confirm modal
            const modal = document.createElement('div');
            modal.className = `fixed top-0 left-0 w-full h-full flex items-center justify-center bg-black bg-opacity-60 z-50`;

            `;
            document.body.appendChild(modal);
        }

        function finishExam() {
            clearInterval(appState.exam.timerInterval);
            appState.exam.isActive = false;

            // Calculate Score
            let score = 0;
            let details = { mc: 0, complex: 0, matching: 0 };

            // 1. MC (15 questions * 2 = 30)
            questionBank.mc.forEach(q => {
                if (parseInt(appState.exam.answers[q.id]) === q.answer) {
                    score += 2;
                    details.mc++;
                }
            });

            // 2. Complex (10 questions * 4 = 40)
            // Scoring logic: must get ALL correct to get 4 points, or partial scoring?
            // To make it simple & standard: Must match exact array (order agnostic) to get 4.
            questionBank.complex.forEach(q => {
                const userAns = appState.exam.answers[q.id] || [];
                const correctAns = q.answers;
                // Check if arrays have same elements
                const isCorrect = userAns.length === correctAns.length && 
                                  userAns.every(val => correctAns.includes(parseInt(val)));
                if (isCorrect) {
                    score += 4;
                    details.complex++;
                }
            });

            // 3. Matching (10 questions * 3 = 30)
            questionBank.matching.forEach(q => {
                if (appState.exam.answers[q.id] === q.answer) {
                    score += 3;
                    details.matching++;
                }
            });

            // Save score to student profile (in-memory)
            if(appState.currentUser.key !== 'TEST_GURU') {
                appState.students[appState.currentUser.key].scores.push({
                    date: new Date().toLocaleString(),
                    score: score,
                    details: details
                });
            }

            renderResult(score, details);
        }

                            <!-- Action Buttons -->
                            <div class="flex flex-col sm:flex-row gap-4 justify-center no-print mt-8">
                                <button onclick="window.print()" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition shadow flex items-center justify-center gap-2">
                                    🖨️ Cetak / Unduh PDF
                                </button>
                                ${user.key === 'TEST_GURU' 
                                    ? `<button onclick="renderAdminDashboard()" class="px-6 py-3 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-900 transition shadow">Kembali ke Admin</button>`
                                    : `<button onclick="logout()" class="px-6 py-3 bg-slate-200 text-slate-800 font-bold rounded-lg hover:bg-slate-300 transition shadow">Keluar</button>`
                                }
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize App on load
        window.onload = () => {
            initApp();
        };

    </script>
</body>
</html>
